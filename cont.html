<!DOCTYPE html>
<html lang="ro" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ZenithFit – Cont</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- HEADER -->
  <header class="header">
    <div class="container header__inner">
      <a class="logo" href="index.html">ZENITHFIT</a>

      <nav class="nav">
        <a href="index.html">Acasă</a>
        <a href="produse.html">Produse</a>
        <a href="despre.html">Despre noi</a>
        <a href="contact.html">Contact</a>
        <a href="cont.html" class="active">Cont</a>
      </nav>

      <button id="theme-toggle" class="icon-btn" type="button" aria-label="Comută tema">🌙</button>
      <button class="burger" id="burger" aria-label="Meniu">☰</button>
    </div>
  </header>

  <!-- ACCOUNT -->
  <section class="container section">
    <h1 class="section__title">Contul meu</h1>

    <div id="auth-wrapper" class="products" style="grid-template-columns:1fr 1fr; gap:1rem;">
      <!-- LOGIN -->
      <form id="login-form" class="product" style="gap:12px">
        <div class="product__title">Autentificare</div>
        <input id="login-email" type="email" placeholder="Email" required
               style="padding:12px;border-radius:12px;border:1px solid var(--border);background:rgba(0,0,0,.08);color:var(--text)">
        <input id="login-pass" type="password" placeholder="Parolă" required
               style="padding:12px;border-radius:12px;border:1px solid var(--border);background:rgba(0,0,0,.08);color:var(--text)">
        <button class="btn">Intră</button>
      </form>

      <!-- REGISTER -->
      <form id="register-form" class="product" style="gap:12px">
        <div class="product__title">Înregistrare</div>
        <input id="reg-name" type="text" placeholder="Nume complet" required
               style="padding:12px;border-radius:12px;border:1px solid var(--border);background:rgba(0,0,0,.08);color:var(--text)">
        <input id="reg-email" type="email" placeholder="Email" required
               style="padding:12px;border-radius:12px;border:1px solid var(--border);background:rgba(0,0,0,.08);color:var(--text)">
        <input id="reg-pass" type="password" minlength="6" placeholder="Parolă (min. 6)" required
               style="padding:12px;border-radius:12px;border:1px solid var(--border);background:rgba(0,0,0,.08);color:var(--text)">
        <button class="btn">Creează cont</button>
      </form>
    </div>

    <!-- AFTER LOGIN -->
    <div id="auth-status" class="product" style="display:none; gap:12px; margin-top:1rem;">
      <h3 class="product__title">Bine ai venit!</h3>
      <p id="auth-user" class="lead"></p>
      <button id="logout" class="btn" type="button">Ieșire</button>
    </div>
  </section>

  <footer class="footer">
    <div class="container footer__inner">
      <nav class="footer__links">
        <a href="index.html">Acasă</a><a href="produse.html">Produse</a>
        <a href="despre.html">Despre noi</a><a href="contact.html">Contact</a><a href="cont.html">Cont</a>
      </nav>
      <small>© <span id="year"></span> ZenithFit</small>
    </div>
  </footer>

  <!-- SCRIPT: tema, burger, auth (demo pe localStorage) -->
  <script>
  document.addEventListener("DOMContentLoaded", () => {
    // --- Elemente UI ---
    const root = document.documentElement;
    const btn = document.getElementById("theme-toggle");
    const burger = document.getElementById("burger");
    const nav = document.querySelector(".nav");

    // --- Tema ---
    const savedTheme = localStorage.getItem("theme") || "light";
    root.setAttribute("data-theme", savedTheme);

    function updateThemeIcon() {
      if (!btn) return;
      btn.textContent = root.getAttribute("data-theme") === "dark" ? "☀️" : "🌙";
    }
    updateThemeIcon();

    btn.addEventListener("click", () => {
      const next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
      root.setAttribute("data-theme", next);
      localStorage.setItem("theme", next);
      updateThemeIcon();
    });

    // --- Meniu mobil ---
    burger.addEventListener("click", () => {
      if (!nav) return;
      nav.classList.toggle("nav--open");
    });

    // --- Anul din footer ---
    const yearEl = document.getElementById("year");
    if (yearEl) yearEl.textContent = new Date().getFullYear();

    // --- AUTH demo (localStorage) ---
    const LS_USERS = "zf_users";
    const LS_CUR = "zf_current_user";
    const $ = selector => document.querySelector(selector);

    function loadUsers() {
      try {
        return JSON.parse(localStorage.getItem(LS_USERS)) || [];
      } catch {
        return [];
      }
    }
    function saveUsers(list) {
      localStorage.setItem(LS_USERS, JSON.stringify(list));
    }
    function getCurrent() {
      try {
        return JSON.parse(localStorage.getItem(LS_CUR));
      } catch {
        return null;
      }
    }
    function setCurrent(u) {
      localStorage.setItem(LS_CUR, JSON.stringify(u));
    }

    function renderAuthUI() {
      const current = getCurrent();
      const wrapper = $("#auth-wrapper");
      const status = $("#auth-status");
      const who = $("#auth-user");
      if (current) {
        if (wrapper) wrapper.style.display = "none";
        if (status) {
          status.style.display = "block";
          who.textContent = Ești autentificat ca ${current.name} (${current.email}).;
        }
      } else {
        if (wrapper) wrapper.style.display = "grid";
        if (status) status.style.display = "none";
      }
    }

    // Register
    const regForm = $("#register-form");
    if (regForm) {
      regForm.addEventListener("submit", (e) => {
        e.preventDefault();
        const name = $("#reg-name").value.trim();
        const email = $("#reg-email").value.trim().toLowerCase();
        const pass = $("#reg-pass").value;
        if (!name || !email || !pass) return alert("Completează toate câmpurile.");

        const users = loadUsers();
        if (users.some(u => u.email === email)) {
          return alert("Email deja folosit.");
        }

        const hashed = btoa(pass); // demo only
        users.push({ name, email, pass: hashed });
        saveUsers(users);
        setCurrent({ name, email });
        alert("Cont creat (demo).");
        renderAuthUI();
      });
    }

    // Login
    const loginForm = $("#login-form");
    if (loginForm) {
      loginForm.addEventListener("submit", (e) => {
        e.preventDefault();
        const email = $("#login-email").value.trim().toLowerCase();
        const pass = $("#login-pass").value;
        const hashed = btoa(pass);
        const users = loadUsers();
        const user = users.find(u => u.email === email && u.pass === hashed);
        if (!user) {
          return alert("Credențiale incorecte.");
        }
        setCurrent({ name: user.name, email: user.email });
        alert("Autentificat (demo).");
        renderAuthUI();
      });
    }

    // Logout
    const logoutBtn = $("#logout");
    if (logoutBtn) {
      logoutBtn.addEventListener("click", () => {
        localStorage.removeItem(LS_CUR);
        renderAuthUI();
      });
    }

    // Init UI
    renderAuthUI();
  });
  </script>
</body>
</html>
