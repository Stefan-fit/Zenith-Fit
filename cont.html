<!DOCTYPE html>
<html lang="ro" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ZenithFit – Cont</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- HEADER -->
  <header class="header">
    <div class="container header__inner">
      <a class="logo" href="index.html">ZENITHFIT</a>

      <nav class="nav">
        <a href="index.html">Acasă</a>
        <a href="produse.html">Produse</a>
        <a href="despre.html">Despre noi</a>
        <a href="contact.html">Contact</a>
        <a href="cont.html" class="active">Cont</a>
      </nav>

      <div class="header-actions" style="display:flex;align-items:center;gap:10px;">
        <a href="cart.html" id="cart-link" class="icon-btn" aria-label="Vezi coș">🛒 <span id="cart-count">0</span></a>
        <button id="theme-toggle" class="icon-btn" type="button" aria-label="Comută tema">🌙</button>
        <button class="burger" id="burger" aria-label="Meniu mobil">☰</button>
      </div>
    </div>
  </header>

  <!-- ACCOUNT -->
  <section class="container section">
    <h1 class="section__title">Contul meu</h1>

    <div id="auth-wrapper" class="products" style="grid-template-columns:1fr 1fr; gap:1rem;">
      <!-- LOGIN -->
      <form id="login-form" class="product" style="gap:12px">
        <div class="product__title">Autentificare</div>
        <input id="login-email" type="email" placeholder="Email" required
               style="padding:12px;border-radius:12px;border:1px solid var(--border);background:rgba(0,0,0,.04);color:var(--text)">
        <input id="login-pass" type="password" placeholder="Parolă" required
               style="padding:12px;border-radius:12px;border:1px solid var(--border);background:rgba(0,0,0,.04);color:var(--text)">
        <button class="btn">Intră</button>
      </form>

      <!-- REGISTER -->
      <form id="register-form" class="product" style="gap:12px">
        <div class="product__title">Înregistrare</div>
        <input id="reg-name" type="text" placeholder="Nume complet" required
               style="padding:12px;border-radius:12px;border:1px solid var(--border);background:rgba(0,0,0,.04);color:var(--text)">
        <input id="reg-email" type="email" placeholder="Email" required
               style="padding:12px;border-radius:12px;border:1px solid var(--border);background:rgba(0,0,0,.04);color:var(--text)">
        <input id="reg-pass" type="password" minlength="6" placeholder="Parolă (min. 6)" required
               style="padding:12px;border-radius:12px;border:1px solid var(--border);background:rgba(0,0,0,.04);color:var(--text)">
        <button class="btn">Creează cont</button>
      </form>
    </div>

    <!-- AFTER LOGIN -->
    <div id="auth-status" class="product" style="display:none; gap:12px; margin-top:1rem;">
      <h3 class="product__title">Bine ai venit!</h3>
      <p id="auth-user" class="lead"></p>
      <button id="logout" class="btn" type="button">Ieșire</button>
    </div>
  </section>

  <footer class="footer">
    <div class="container footer__inner">
      <nav class="footer__links">
        <a href="index.html">Acasă</a><a href="produse.html">Produse</a>
        <a href="despre.html">Despre noi</a><a href="contact.html">Contact</a><a href="cont.html">Cont</a>
      </nav>
      <small>© <span id="year"></span> ZenithFit</small>
    </div>
  </footer>

  <!-- SCRIPT: tema, burger, badge coș, anul, auth demo -->
  <script>
  document.addEventListener("DOMContentLoaded", () => {
    const CART_KEY = "zf_cart_v1";
    const root = document.documentElement;
    const btn = document.getElementById("theme-toggle");
    const burger = document.getElementById("burger");
    const nav = document.querySelector(".nav");
    const yearEl = document.getElementById("year");
    const cartCountEl = document.getElementById("cart-count");

    // tema
    const savedTheme = localStorage.getItem("theme") || "light";
    root.setAttribute("data-theme", savedTheme);
    function updateIcon() { if (!btn) return; btn.textContent = root.getAttribute("data-theme") === "dark" ? "☀️" : "🌙"; }
    updateIcon();
    if (btn) {
      btn.addEventListener("click", () => {
        const next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
        root.setAttribute("data-theme", next);
        localStorage.setItem("theme", next);
        updateIcon();
      });
    }

    // burger
    if (burger && nav) burger.addEventListener("click", () => nav.classList.toggle("nav--open"));

    // year
    if (yearEl) yearEl.textContent = new Date().getFullYear();

    // badge
    function updateCartBadge() {
      if (!cartCountEl) return;
      try {
        const cart = JSON.parse(localStorage.getItem(CART_KEY)) || {};
        const total = Object.values(cart).reduce((s, it) => s + (it.qty || 0), 0);
        cartCountEl.textContent = total;
      } catch {
        cartCountEl.textContent = 0;
      }
    }
    updateCartBadge();
    window.addEventListener("storage", function (e) { if (e.key === CART_KEY) updateCartBadge(); });

    // --- AUTH demo (localStorage) ---
    const LS_USERS = "zf_users";
    const LS_CUR = "zf_current_user";
    const $ = selector => document.querySelector(selector);

    function loadUsers() { try { return JSON.parse(localStorage.getItem(LS_USERS)) || []; } catch { return []; } }
    function saveUsers(list) { localStorage.setItem(LS_USERS, JSON.stringify(list)); }
    function getCurrent() { try { return JSON.parse(localStorage.getItem(LS_CUR)); } catch { return null; } }
    function setCurrent(u) { localStorage.setItem(LS_CUR, JSON.stringify(u)); }

    function renderAuthUI() {
      const current = getCurrent();
      const wrapper = $("#auth-wrapper");
      const status = $("#auth-status");
      const who = $("#auth-user");
      if (current) {
        if (wrapper) wrapper.style.display = "none";
        if (status) { status.style.display = "block"; who.textContent = `Ești autentificat ca ${current.name} (${current.email}).`; }
      } else {
        if (wrapper) wrapper.style.display = "grid";
        if (status) status.style.display = "none";
      }
    }

    const regForm = $("#register-form");
    if (regForm) {
      regForm.addEventListener("submit", (e) => {
        e.preventDefault();
        const name = $("#reg-name").value.trim();
        const email = $("#reg-email").value.trim().toLowerCase();
        const pass = $("#reg-pass").value;
        if (!name || !email || !pass) return alert("Completează toate câmpurile.");
        const users = loadUsers();
        if (users.some(u => u.email === email)) return alert("Email deja folosit.");
        users.push({ name, email, pass: btoa(pass) });
        saveUsers(users);
        setCurrent({ name, email });
        alert("Cont creat (demo).");
        renderAuthUI();
      });
    }

    const loginForm = $("#login-form");
    if (loginForm) {
      loginForm.addEventListener("submit", (e) => {
        e.preventDefault();
        const email = $("#login-email").value.trim().toLowerCase();
        const pass = $("#login-pass").value;
        const users = loadUsers();
        const user = users.find(u => u.email === email && u.pass === btoa(pass));
        if (!user) return alert("Credențiale incorecte.");
        setCurrent({ name: user.name, email: user.email });
        alert("Autentificat (demo).");
        renderAuthUI();
      });
    }

    const logoutBtn = $("#logout");
    if (logoutBtn) logoutBtn.addEventListener("click", () => { localStorage.removeItem(LS_CUR); renderAuthUI(); });

    renderAuthUI();
  });
  </script>
</body>
</html>
