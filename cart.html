<!DOCTYPE html>
<html lang="ro" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ZenithFit – Coșul meu</title>

  <!-- Link la fișierul principal -->
  <link rel="stylesheet" href="styles.css" />

  <!-- Stiluri locale care suprascriu orice regulă conflictuală din styles.css -->
  <style>
    /* ----- Forțează layout corect pentru articole din coș ----- */
    #cart-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.25rem; }

    /* Card produs: afișare verticală, spațiu pentru imagine + text + butoane */
    #cart-container .product {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.6rem;
      padding: 1.15rem;
      border-radius: 12px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      box-shadow: 0 8px 20px var(--shadow);
      min-height: 260px;           /* Asigurăm spațiu pentru imagine + text + butoane */
      overflow: visible;
      position: relative;
    }

    /* Containerul imaginii: zonă fixă — imaginea nu mai "plutește" peste titlu */
    #cart-container .product__media {
      width: 100%;
      height: 180px;               /* ajustează dacă vrei imagini mai mari (200-220) */
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: transparent;
      border-radius: 8px;
    }

    /* Imaginea în container: păstrăm proporțiile, nu decupăm */
    #cart-container .product__media img {
      max-height: 100%;
      width: auto;
      object-fit: contain;
      display: block;
      margin: 0 auto;
      pointer-events: none;       /* evită click-uri accidentale pe imagine */
    }

    /* Titlu & preț sub imagine — asigurăm contrast si spacing */
    #cart-container .product__title {
      font-weight: 700;
      color: var(--text);
      text-align: center;
      margin-top: 0.25rem;
      z-index: 2;
      background: transparent;
    }
    #cart-container .product__price {
      color: var(--accent);
      font-weight: 700;
      margin-bottom: 0.3rem;
    }

    /* Grup butoane: împins jos, aliniat orizontal */
    #cart-container .product .controls {
      margin-top: auto; /* împinge butoanele la baza cardului */
      display: flex;
      gap: 0.6rem;
      align-items: center;
      justify-content: center;
      width: 100%;
    }

    /* Stil butoane mici */
    #cart-container .product .controls .btn {
      min-width: 56px;
      padding: 8px 12px;
      border-radius: 10px;
    }

    /* Buton mare "Șterge" */
    #cart-container .product .controls .remove {
      flex: 1 0 auto;
      background: transparent;
      border: 2px solid var(--accent);
      color: var(--accent);
      font-weight: 700;
    }

    /* Responsive: imagini puțin mai mici pe mobil */
    @media (max-width: 760px) {
      #cart-container .product__media { height: 140px; }
      #cart-container .product { min-height: 220px; }
    }
  </style>
</head>
<body>
  <!-- HEADER (acelasi header ca in restul paginilor) -->
  <header class="header">
    <div class="container header__inner">
      <a class="logo" href="index.html">ZENITHFIT</a>

      <nav class="nav">
        <a href="index.html">Acasă</a>
        <a href="produse.html">Produse</a>
        <a href="despre.html">Despre noi</a>
        <a href="contact.html">Contact</a>
        <a href="cont.html">Cont</a>
      </nav>

      <div style="display:flex;align-items:center;gap:8px">
        <a href="cart.html" id="cart-link" class="icon-btn" aria-label="Vezi coș">🛒 <span id="cart-count">0</span></a>
        <button id="theme-toggle" class="icon-btn" aria-label="Comută tema">🌙</button>
        <button class="burger" id="burger" aria-label="Meniu">☰</button>
      </div>
    </div>
  </header>

  <!-- COȘ -->
  <section class="container section">
    <h1 class="section__title">Coșul meu</h1>

    <div id="cart-container" class="products" aria-live="polite"></div>

    <div id="cart-summary" class="product" style="margin-top:2rem; text-align:center; display:none;">
      <h3>Total: <span id="cart-total">0</span> RON</h3>
      <div style="margin-top:1rem; display:flex; justify-content:center; gap:1rem;">
        <button id="clear-cart" class="btn btn--ghost">Golește coșul</button>
        <button id="checkout" class="btn">Finalizează comanda</button>
      </div>
    </div>

    <p id="empty-cart" style="text-align:center; margin-top:2rem;">Coșul tău este gol momentan.</p>
  </section>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="container footer__inner">
      <nav class="footer__links">
        <a href="index.html">Acasă</a><a href="produse.html">Produse</a>
        <a href="despre.html">Despre noi</a><a href="contact.html">Contact</a><a href="cont.html">Cont</a>
      </nav>
      <small>© <span id="year"></span> ZenithFit</small>
    </div>
  </footer>

  <!-- SCRIPT -->
  <script>
  document.addEventListener("DOMContentLoaded", () => {
    const CART_KEY = "zf_cart_v1";
    const cartContainer = document.getElementById("cart-container");
    const emptyText = document.getElementById("empty-cart");
    const summary = document.getElementById("cart-summary");
    const totalEl = document.getElementById("cart-total");
    const clearBtn = document.getElementById("clear-cart");
    const checkoutBtn = document.getElementById("checkout");
    const cartCount = document.getElementById("cart-count");
    const themeBtn = document.getElementById("theme-toggle");
    const burger = document.getElementById("burger");
    const nav = document.querySelector(".nav");
    const root = document.documentElement;

    // ==== Tema + header helpers ====
    const savedTheme = localStorage.getItem("theme") || "light";
    root.setAttribute("data-theme", savedTheme);
    if (themeBtn) themeBtn.textContent = root.getAttribute("data-theme") === "dark" ? "☀️" : "🌙";
    if (themeBtn) themeBtn.addEventListener("click", () => {
      const next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
      root.setAttribute("data-theme", next);
      localStorage.setItem("theme", next);
      themeBtn.textContent = next === "dark" ? "☀️" : "🌙";
    });
    if (burger && nav) burger.addEventListener("click", () => nav.classList.toggle("nav--open"));
    if (document.getElementById("year")) document.getElementById("year").textContent = new Date().getFullYear();

    // ==== Cart functions ====
    function loadCart() {
      try { return JSON.parse(localStorage.getItem(CART_KEY)) || {}; }
      catch { return {}; }
    }
    function saveCart(cart) {
      localStorage.setItem(CART_KEY, JSON.stringify(cart));
      updateCount();
    }
    function updateCount() {
      try {
        const cart = loadCart();
        const total = Object.values(cart).reduce((s, it) => s + (it.qty || 0), 0);
        cartCount.textContent = total;
      } catch {
        cartCount.textContent = 0;
      }
    }

    function renderCart() {
      const cart = loadCart();
      const items = Object.values(cart);
      cartContainer.innerHTML = "";
      if (items.length === 0) {
        emptyText.style.display = "block";
        summary.style.display = "none";
        totalEl.textContent = 0;
        return;
      }
      emptyText.style.display = "none";
      summary.style.display = "block";

      let total = 0;
      items.forEach(item => {
        const itemTotal = (Number(item.price) || 0) * (item.qty || 0);
        total += itemTotal;

        const article = document.createElement("article");
        article.className = "product";
        article.innerHTML = `
          <div class="product__media">
            <img src="${item.img || 'images/placeholder.png'}" alt="${escapeHtml(item.name)}">
          </div>
          <h3 class="product__title">${escapeHtml(item.name)}</h3>
          <div class="product__price">${item.price} RON × ${item.qty} = <b>${itemTotal} RON</b></div>
          <div class="controls">
            <button class="btn btn--ghost dec" data-id="${item.id}">-</button>
            <button class="btn btn--ghost inc" data-id="${item.id}">+</button>
            <button class="btn remove" data-id="${item.id}">Șterge</button>
          </div>
        `;
        cartContainer.appendChild(article);
      });

      totalEl.textContent = total;
    }

    // Small helper to avoid HTML injection in names
    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, function (m) {
        return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[m];
      });
    }

    // Delegated events for inc/dec/remove
    cartContainer.addEventListener("click", e => {
      const btn = e.target.closest("button");
      if (!btn) return;
      const id = btn.dataset.id;
      if (!id) return;
      const cart = loadCart();
      if (btn.classList.contains("remove")) {
        delete cart[id];
      } else if (btn.classList.contains("inc")) {
        if (cart[id]) cart[id].qty = (cart[id].qty || 0) + 1;
      } else if (btn.classList.contains("dec")) {
        if (cart[id]) {
          cart[id].qty = (cart[id].qty || 0) - 1;
          if (cart[id].qty <= 0) delete cart[id];
        }
      }
      saveCart(cart);
      renderCart();
    });

    clearBtn.addEventListener("click", () => {
      if (confirm("Sigur vrei să golești coșul?")) {
        localStorage.removeItem(CART_KEY);
        renderCart();
        updateCount();
      }
    });

    checkoutBtn.addEventListener("click", () => {
      alert("Aceasta este o simulare — implementarea plății se va face ulterior.");
    });

    // React la modificări în alt tab
    window.addEventListener("storage", e => {
      if (e.key === CART_KEY) {
        renderCart();
        updateCount();
      }
    });

    // Init
    renderCart();
    updateCount();
  });
  </script>
</body>
</html>
