<!DOCTYPE html>
<html lang="ro" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ZenithFit – Coșul meu</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- HEADER -->
  <header class="header">
    <div class="container header__inner">
      <a class="logo" href="index.html">ZENITHFIT</a>

      <nav class="nav">
        <a href="index.html">Acasă</a>
        <a href="produse.html">Produse</a>
        <a href="despre.html">Despre noi</a>
        <a href="contact.html">Contact</a>
        <a href="cont.html">Cont</a>
      </nav>

      <div style="display:flex;align-items:center;gap:8px">
        <a href="cart.html" id="cart-link" class="icon-btn" aria-label="Vezi coș">🛒 <span id="cart-count">0</span></a>
        <button id="theme-toggle" class="icon-btn" aria-label="Comută tema">🌙</button>
        <button class="burger" id="burger" aria-label="Meniu">☰</button>
      </div>
    </div>
  </header>

  <!-- COȘ -->
  <section class="container section">
    <h1 class="section__title">Coșul meu</h1>

    <div id="cart-container" class="products"></div>

    <div id="cart-summary" class="product" style="margin-top:2rem; text-align:center; display:none;">
      <h3>Total: <span id="cart-total">0</span> RON</h3>
      <div style="margin-top:1rem; display:flex; justify-content:center; gap:1rem;">
        <button id="clear-cart" class="btn btn--ghost">Golește coșul</button>
        <button id="checkout" class="btn">Finalizează comanda</button>
      </div>
    </div>

    <p id="empty-cart" style="text-align:center; margin-top:2rem;">Coșul tău este gol momentan.</p>
  </section>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="container footer__inner">
      <nav class="footer__links">
        <a href="index.html">Acasă</a><a href="produse.html">Produse</a>
        <a href="despre.html">Despre noi</a><a href="contact.html">Contact</a><a href="cont.html">Cont</a>
      </nav>
      <small>© <span id="year"></span> ZenithFit</small>
    </div>
  </footer>

  <!-- SCRIPT -->
  <script>
  document.addEventListener("DOMContentLoaded", () => {
    const CART_KEY = "zf_cart_v1";
    const cartContainer = document.getElementById("cart-container");
    const emptyText = document.getElementById("empty-cart");
    const summary = document.getElementById("cart-summary");
    const totalEl = document.getElementById("cart-total");
    const clearBtn = document.getElementById("clear-cart");
    const checkoutBtn = document.getElementById("checkout");
    const cartCount = document.getElementById("cart-count");
    const themeBtn = document.getElementById("theme-toggle");
    const burger = document.getElementById("burger");
    const nav = document.querySelector(".nav");
    const root = document.documentElement;

    // === Tema ===
    const savedTheme = localStorage.getItem("theme") || "light";
    root.setAttribute("data-theme", savedTheme);
    const updateIcon = () => themeBtn.textContent = root.getAttribute("data-theme") === "dark" ? "☀️" : "🌙";
    updateIcon();
    themeBtn.addEventListener("click", () => {
      const next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
      root.setAttribute("data-theme", next);
      localStorage.setItem("theme", next);
      updateIcon();
    });
    burger.addEventListener("click", () => nav.classList.toggle("nav--open"));
    document.getElementById("year").textContent = new Date().getFullYear();

    // === Funcții coș ===
    function loadCart() {
      try { return JSON.parse(localStorage.getItem(CART_KEY)) || {}; }
      catch { return {}; }
    }
    function saveCart(cart) {
      localStorage.setItem(CART_KEY, JSON.stringify(cart));
      updateCount();
    }
    function updateCount() {
      const cart = loadCart();
      const total = Object.values(cart).reduce((s, it) => s + it.qty, 0);
      cartCount.textContent = total;
    }

    function renderCart() {
      const cart = loadCart();
      const items = Object.values(cart);
      cartContainer.innerHTML = "";
      if (items.length === 0) {
        emptyText.style.display = "block";
        summary.style.display = "none";
        return;
      }
      emptyText.style.display = "none";
      summary.style.display = "block";

      let total = 0;
      items.forEach(item => {
        const itemTotal = item.price * item.qty;
        total += itemTotal;

        const article = document.createElement("article");
        article.className = "product";
        article.innerHTML = `
          <div class="product__media">
            <img src="${item.img}" alt="${item.name}">
          </div>
          <h3 class="product__title">${item.name}</h3>
          <p>${item.price} RON × ${item.qty} = <b>${itemTotal} RON</b></p>
          <div style="margin-top:0.5rem; display:flex; gap:0.5rem; justify-content:center;">
            <button class="btn btn--ghost dec" data-id="${item.id}">-</button>
            <button class="btn btn--ghost inc" data-id="${item.id}">+</button>
            <button class="btn btn--ghost remove" data-id="${item.id}">Șterge</button>
          </div>
        `;
        cartContainer.appendChild(article);
      });

      totalEl.textContent = total;
    }

    // === Evenimente ===
    cartContainer.addEventListener("click", e => {
      const id = e.target.dataset.id;
      if (!id) return;
      const cart = loadCart();
      if (e.target.classList.contains("remove")) {
        delete cart[id];
      } else if (e.target.classList.contains("inc")) {
        cart[id].qty += 1;
      } else if (e.target.classList.contains("dec")) {
        cart[id].qty -= 1;
        if (cart[id].qty <= 0) delete cart[id];
      }
      saveCart(cart);
      renderCart();
    });

    clearBtn.addEventListener("click", () => {
      if (confirm("Sigur vrei să golești coșul?")) {
        localStorage.removeItem(CART_KEY);
        renderCart();
        updateCount();
      }
    });

    checkoutBtn.addEventListener("click", () => {
      alert("Aceasta este o simulare — implementarea plății se va face ulterior.");
    });

    // === Inițializare ===
    renderCart();
    updateCount();
  });
  </script>
</body>
</html>
