<!DOCTYPE html>
<html lang="ro" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ZenithFit – Contact</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="header">
    <div class="container header__inner">
      <a class="logo" href="index.html">ZENITHFIT</a>
      <nav class="nav">
        <a href="index.html">Acasă</a>
        <a href="produse.html">Produse</a>
        <a href="despre.html">Despre noi</a>
        <a href="contact.html" class="active">Contact</a>
        <a href="cont.html">Cont</a>
      </nav>
      <button id="theme-toggle" class="icon-btn">🌙</button>
      <button class="burger" id="burger">☰</button>
    </div>
  </header>

  <!-- CONTACT -->
  <section class="container section">
    <h1 class="section__title">Hai să vorbim</h1>
    <div class="products" style="grid-template-columns:1fr 1fr">
      <form class="product" onsubmit="event.preventDefault(); alert('Mulțumim! Te contactăm în curând.')" style="gap:12px">
        <div class="product__title">Trimite un mesaj</div>
        <input type="text" placeholder="Nume" required style="padding:12px;border-radius:12px;border:1px solid var(--border);background:rgba(0,0,0,.08);color:var(--text)">
        <input type="email" placeholder="Email" required style="padding:12px;border-radius:12px;border:1px solid var(--border);background:rgba(0,0,0,.08);color:var(--text)">
        <textarea rows="6" placeholder="Mesaj" required style="padding:12px;border-radius:12px;border:1px solid var(--border);background:rgba(0,0,0,.08);color:var(--text)"></textarea>
        <button class="btn">Trimite</button>
      </form>

      <div class="product" style="gap:10px">
        <div class="product__title">Date de contact</div>
        <p class="lead">Email: zenithfit@yahoo.com</p>
        <p class="lead">Telefon: 0236 446 248</p>
        <p class="lead">Program: L–V 09:00–18:00</p>
        <div class="product__media" style="height:260px"><img src="images/contact.png" alt="Contact"></div>
      </div>
    </div>
  </section>

  <footer class="footer">
    <div class="container footer__inner">
      <nav class="footer__links">
        <a href="index.html">Acasă</a><a href="produse.html">Produse</a><a href="despre.html">Despre noi</a><a href="contact.html">Contact</a><a href="cont.html">Cont</a>
      </nav>
      <small>© <span id="year"></span> ZenithFit</small>
    </div>
  </footer>

  <script>
    (function(){
      const r=document.documentElement, b=document.getElementById("theme-toggle"), g=document.getElementById("burger"), n=document.querySelector(".nav");
      r.setAttribute("data-theme", localStorage.getItem("theme")||"light");
      const I=()=>b.textContent=(r.getAttribute("data-theme")==="dark")?"☀️":"🌙";
      I(); b.onclick=()=>{const x=r.getAttribute("data-theme")==="dark"?"light":"dark"; r.setAttribute("data-theme",x); localStorage.setItem("theme",x); I();}
      g.onclick=()=>n.classList.toggle("nav--open");
      document.getElementById("year").textContent=new Date().getFullYear();
    })();
  </script>
</body>
</html>
